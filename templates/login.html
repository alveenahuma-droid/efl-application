{% extends "base.html" %}
{% block title %}Login · EFL{% endblock %}
{% block content %}
  <section class="auth-wrap">
    <form id="login-form" class="panel form auth-card" method="post" onsubmit="event.preventDefault(); document.getElementById('login-error').textContent = 'Sign-in will be available when accounts are connected.';">
      <p class="eyebrow">Account</p>
      <h1>Sign in</h1>
      <p class="lede">Use the email address registered with EFL. Your conversions and saved quotes stay with this account.</p>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required placeholder="name@example.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit">Sign in</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </section>
{% endblock %}
