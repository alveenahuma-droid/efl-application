{% extends "base.html" %}
{% block title %}Create account · EFL{% endblock %}
{% block content %}
  <section class="auth-wrap">
    <form id="register-form" class="panel form auth-card" novalidate>
      <div>
        <h1>Create account</h1>
        <p class="lede">Register to convert currency and keep a history of your conversions and quotes.</p>
      </div>
      <div class="field">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required placeholder="name@example.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8">
        <p class="hint">At least 8 characters.</p>
      </div>
      <button type="submit">Create account</button>
      <p id="register-error" class="error" role="alert"></p>
      <p class="hint">Already registered? <a href="/login">Sign in</a>.</p>
    </form>
  </section>
{% endblock %}
