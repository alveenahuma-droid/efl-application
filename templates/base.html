<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c2a3a">
  <title>{% block title %}EFL{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">EFL</span>
        <span class="brand-copy">
          <span class="brand-name">EFL</span>
          <span class="brand-tag">Currency and savings</span>
        </span>
      </a>
      <nav class="site-nav" aria-label="Primary">
        <a href="/" {% if request.endpoint == "pages.index" %}aria-current="page"{% endif %}>Home</a>
        <a href="/converter" {% if request.endpoint == "pages.converter_page" %}aria-current="page"{% endif %}>Converter</a>
        <a href="/quote-page" {% if request.endpoint == "pages.quote_page" %}aria-current="page"{% endif %}>Quote</a>
        <a href="/history-page" {% if request.endpoint == "pages.history_page" %}aria-current="page"{% endif %}>History</a>
        <a class="nav-login" href="/login" {% if request.endpoint == "pages.login_page" %}aria-current="page"{% endif %}>Login</a>
      </nav>
    </div>
  </header>
  <main id="content">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>EFL application. Conversions from 300 to 5,000, with fees shown before you confirm.</p>
  </footer>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
